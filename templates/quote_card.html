<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background-color: transparent;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .container {
    background: linear-gradient(135deg, #2b2b2b 0%, #1a1a1a 100%);
    border-radius: 16px;
    padding: 40px;
    width: 900px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    border: 1px solid #3f3f3f;
    position: relative;
  }
  .header {
    display: flex;
    align-items: center;
    margin-bottom: 30px;
  }
  .avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 3px solid #ffffff;
    overflow: hidden;
    margin-right: 20px;
    flex-shrink: 0;
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .info {
    display: flex;
    flex-direction: column;
  }
  .name {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 5px;
  }
  .title {
    font-size: 18px;
    color: #a3a3a3;
  }
  .quote {
    font-size: 26px;
    line-height: 1.5;
    font-style: italic;
    color: #e5e5e5;
  }
  .quote-mark {
    font-size: 60px;
    color: #4b4b4b;
    position: absolute;
    top: 20px;
    right: 30px;
    font-family: Georgia, serif;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="quote-mark">"</div>
    <div class="header">
      <div class="avatar">
        <img src="{{ avatar_url }}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'black\'><path d=\'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z\'/></svg>'">
      </div>
      <div class="info">
        <div class="name">{{ name }}</div>
        <div class="title">{{ title }}</div>
      </div>
    </div>
    <div class="quote">
      "{{ text }}"
    </div>
  </div>
</body>
</html>

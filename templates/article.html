<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background-color: #f5f5f5;
    color: #1a1a1a;
    font-family: 'Times New Roman', Times, serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .article-container {
    background-color: #ffffff;
    padding: 60px;
    width: 1000px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    border-top: 5px solid #cc0000;
  }
  .source {
    font-size: 18px;
    text-transform: uppercase;
    font-weight: bold;
    color: #555;
    margin-bottom: 20px;
    letter-spacing: 2px;
  }
  .headline {
    font-size: 48px;
    font-weight: bold;
    line-height: 1.2;
    margin-bottom: 30px;
  }
  .content {
    font-size: 28px;
    line-height: 1.6;
    color: #333;
  }
</style>
</head>
<body>
  <div class="article-container">
    <div class="source">{{ source }}</div>
    <div class="headline">{{ headline }}</div>
    <div class="content">
      {{ content_before }}<br><br>
      <span id="target">{{ target_text }}</span>
    </div>
  </div>
</body>
</html>

[project]
name = "kurgu-studio-api"
version = "0.1.0"
description = "Phase 1 thin Studio API and deterministic OpenAPI foundation for Kurgu Engine."
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.140.0",
  "jsonschema[format]==4.26.0",
  "pydantic==2.13.4",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.1.1",
]

[tool.kurgu-studio-api]
phase = "phase-1-control-plane"
scope = "thin-project-api-contracts"
hash_secured_lock = false
